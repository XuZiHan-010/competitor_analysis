[project]
name = "competitor-analysis-backend"
version = "0.1.0"
description = "FastAPI and LangGraph backend for the competitor analysis agent system."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "langgraph>=0.2.0",
  "langgraph-checkpoint-postgres>=1.0.0",
  "langsmith>=0.1.81",
  "sse-starlette>=2.1.0",
  "structlog>=24.0.0",
  "sqlalchemy>=2.0.0",
  "alembic>=1.13.0",
  "psycopg[binary]>=3.2.0",
  "playwright>=1.45.0",
  "openai>=1.40.0",
  "httpx>=0.27.0",
  "redis>=7.4.0,<8",
  "ddgs>=9.0.0",
]

[project.optional-dependencies]
dev = [
  "black>=24.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "respx>=0.21.0",
  "vcrpy>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "api*", "db*", "graph*", "schemas*", "services*"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "ddgs.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
